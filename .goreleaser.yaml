version: 2

project_name: undoguard

before:
  hooks:
    - go mod verify

builds:
  - id: undoguard
    main: ./cmd/undoguard
    binary: undoguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/celaldrg/undoguard/internal/version.Version={{ .Version }}

archives:
  - id: undoguard
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - examples/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
